
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Misi 4 - Alam Syurga KP2027</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#100d35;color:white;
 font-family:Arial,sans-serif;overflow:hidden;
 user-select:none
}
#game{
 position:relative;width:100vw;height:100dvh;
 overflow:hidden;
 background:linear-gradient(#392b85 0%,#a77ee7 36%,#e5baff 65%,#55c9ba 100%);
}
#sky{
 position:absolute;inset:0;
 background:
 radial-gradient(circle at 15% 18%,#fff8c8 0 2px,transparent 4px),
 radial-gradient(circle at 75% 12%,#fff 0 2px,transparent 4px),
 radial-gradient(circle at 45% 30%,#fff4b0 0 3px,transparent 5px);
}
.cloud{
 position:absolute;width:180px;height:45px;border-radius:50px;
 background:#fff9ff;opacity:.65;filter:blur(2px);
 box-shadow:25px -15px 0 4px #fff9ff,65px 0 0 8px #fff9ff;
}
.c1{top:17%;left:5%}.c2{top:28%;right:5%;transform:scale(.8)}
#palace{
 position:absolute;top:7%;left:50%;transform:translateX(-50%);
 font-size:clamp(55px,10vw,110px);
 filter:drop-shadow(0 0 20px #fff3a0);
}
#mountains{
 position:absolute;bottom:25%;width:100%;height:38%;
 background:linear-gradient(135deg,transparent 30%,#6b5ab7 31% 48%,transparent 49%),
 linear-gradient(45deg,transparent 25%,#8475ce 26% 48%,transparent 49%);
 opacity:.65;
}
#ground{
 position:absolute;bottom:-15%;left:-35%;width:170%;height:63%;
 border-radius:50% 50% 0 0;
 background:repeating-linear-gradient(90deg,#39a98e 0 3px,#42c39d 4px 7px);
 transform:perspective(350px) rotateX(13deg);
 box-shadow:inset 0 25px 35px #b4ffe0;
}
#road{
 position:absolute;bottom:-12%;left:20%;width:60%;height:65%;
 background:linear-gradient(90deg,#9c83d9,#f6d9ff 48%,#9c83d9);
 clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
 opacity:.9;
}
#road:after{
 content:"";position:absolute;inset:0;
 background:repeating-linear-gradient(180deg,transparent 0 70px,#fff8 72px 76px,transparent 78px 140px);
}
#hud{
 position:absolute;top:8px;left:8px;right:8px;z-index:10;
 display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap;
}
.pill{
 background:#21164ddd;border:1px solid #ffe99b;
 padding:8px 11px;border-radius:18px;font-weight:bold;
 font-size:13px;box-shadow:0 3px 8px #0005
}
#progress{
 position:absolute;top:58px;left:50%;transform:translateX(-50%);
 width:min(85%,380px);height:9px;background:#37265e;
 border-radius:20px;overflow:hidden;z-index:10
}
#bar{height:100%;width:0;background:linear-gradient(90deg,#fff176,#ff9bdb)}
#player{
 position:absolute;z-index:5;bottom:14%;left:50%;
 transform:translateX(-50%);font-size:65px;
 width:100px;text-align:center;
 filter:drop-shadow(0 8px 5px #32205c88);
 transition:left .12s;
}
#player .costume{
 position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
 font-size:10px;color:#fff;background:#30164e;
 padding:3px 7px;border-radius:10px;white-space:nowrap
}
.object{
 position:absolute;z-index:4;font-size:clamp(35px,7vw,60px);
 transform:translateX(-50%);
 filter:drop-shadow(0 6px 5px #30205a88);
}
#controls{
 position:absolute;bottom:12px;left:0;right:0;z-index:12;
 display:flex;justify-content:center;gap:18px
}
.ctrl{
 width:65px;height:55px;border:2px solid #fff7;
 border-radius:17px;background:#24144dcc;color:white;
 font-size:25px;font-weight:bold
}
#overlay{
 position:absolute;inset:0;z-index:30;background:#100b35dd;
 display:flex;align-items:center;justify-content:center;
 padding:15px;overflow:auto
}
.panel{
 width:min(95%,520px);max-height:94%;overflow:auto;
 background:linear-gradient(145deg,#3d247d,#17133e);
 border:2px solid #ffe88b;border-radius:25px;
 padding:22px;text-align:center;box-shadow:0 0 35px #ffdb8c66
}
h1{color:#ffe88b;font-size:clamp(25px,6vw,38px);margin:5px}
h2{color:#ffd6ff}
p{line-height:1.5}
button{
 cursor:pointer;border:0;border-radius:13px;padding:12px 17px;
 margin:5px;background:linear-gradient(135deg,#ffe777,#ffae54);
 color:#35164c;font-weight:bold;font-size:15px
}
button:active{transform:scale(.96)}
.characters{
 display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:15px 0
}
.char{
 background:#ffffff18;border:1px solid #fff7;border-radius:15px;
 padding:10px 4px;cursor:pointer
}
.char.selected{border:3px solid #ffe777;background:#ffe77722}
.char .emoji{font-size:38px}
.char small{display:block;color:#ffe5a4;margin-top:5px}
.answer{
 display:block;width:100%;margin:9px 0;
 background:#fff0ff;color:#35164c;text-align:left
}
#questionText{font-size:19px;font-weight:bold;color:#fff2a6}
#feedback{min-height:25px;font-weight:bold}
.candy{
 position:absolute;z-index:40;top:-50px;font-size:30px;
 animation:fall linear forwards;pointer-events:none
}
@keyframes fall{to{transform:translateY(115vh) rotate(700deg)}}
#toast{
 position:absolute;z-index:20;top:23%;left:50%;
 transform:translateX(-50%);font-size:22px;font-weight:bold;
 color:#fff4a3;text-shadow:0 3px 5px #32104b;
 text-align:center;pointer-events:none
}
@media(min-width:700px){
 #player{font-size:85px}
 .object{font-size:65px}
}
</style>
</head>
<body>
<div id="game">
 <div id="sky"></div>
 <div class="cloud c1"></div><div class="cloud c2"></div>
 <div id="palace">🏰</div>
 <div id="mountains"></div>
 <div id="ground"></div><div id="road"></div>

 <div id="hud">
  <div class="pill">💎 Gems: <span id="gems">0</span></div>
  <div class="pill">⭐ Markah: <span id="score">0</span></div>
  <div class="pill">🎯 Betul: <span id="correct">0</span>/10</div>
 </div>
 <div id="progress"><div id="bar"></div></div>
 <div id="toast">ALAM SYURGA KP2027</div>
 <div id="player">🧍
  <span class="costume" id="costume">Pahlawan</span>
 </div>
 <div id="controls">
  <button class="ctrl" id="left">⬅️</button>
  <button class="ctrl" id="jump">⬆️</button>
  <button class="ctrl" id="right">➡️</button>
 </div>
 <div id="overlay">
  <div class="panel" id="startPanel">
   <div style="font-size:55px">🌈✨🏰✨🌈</div>
   <h1>MISI 4</h1>
   <h2>ALAM SYURGA</h2>
   <h2>WARGANEGARA AKTIF</h2>
   <p>Lima pahlawan Melayu menanti cabaran terakhir Episod 1!</p>
   <p><b>Pilih pahlawan anda:</b></p>
   <div class="characters" id="characters"></div>
   <p>Elakkan lembing, panah, bom dan keris. Langgar peti harta karun untuk menjawab soalan!</p>
   <button onclick="startGame()">⚔️ MULAKAN MISI</button>
  </div>
 </div>
</div>

<script>
const $=id=>document.getElementById(id);
const heroes=[
 {name:"Hang Tuah",emoji:"🧔🏻",color:"Biru diraja",desc:"Tanjak biru, baju Melayu dan sampin songket"},
 {name:"Hang Jebat",emoji:"🧔🏽",color:"Merah",desc:"Tanjak merah, baju pahlawan dan sampin"},
 {name:"Hang Kasturi",emoji:"🧔🏼",color:"Hijau",desc:"Tanjak hijau, baju Melayu dan sampin"},
 {name:"Hang Lekir",emoji:"🧔🏾",color:"Hitam",desc:"Tanjak hitam, bengkung dan sampin"},
 {name:"Hang Lekiu",emoji:"🧔🏻‍♂️",color:"Emas",desc:"Tanjak emas, baju pahlawan dan songket"}
];
let selected=0,lane=1,objects=[],running=false,correct=0,score=0;
let gems=Number(localStorage.getItem("kp2027Gems")||0);
let spawnTimer=0,lastTime=0,questionOpen=false,frame=0;
const questions=[
 {q:"Apakah maksud menjadi warganegara yang aktif?",a:["Mengambil bahagian dalam aktiviti masyarakat","Mementingkan diri sendiri","Tidak peduli keadaan sekeliling"],c:0},
 {q:"Apakah tindakan yang menunjukkan semangat kejiranan?",a:["Membantu jiran yang memerlukan","Mengejek jiran","Mengabaikan jiran"],c:0},
 {q:"Mengapa kita perlu menjaga kebersihan kawasan awam?",a:["Supaya persekitaran bersih dan selesa","Supaya orang lain bekerja","Kerana mahu dipuji sahaja"],c:0},
 {q:"Apakah tindakan yang betul apabila melihat sampah di taman?",a:["Mengutip dan membuang ke tong sampah","Membiarkannya","Menambah sampah"],c:0},
 {q:"Bagaimanakah kita menunjukkan hormat kepada kepelbagaian kaum?",a:["Menghormati budaya dan kepercayaan orang lain","Menghina adat orang lain","Memaksa semua orang sama"],c:0},
 {q:"Apakah sikap yang penting ketika menyertai gotong-royong?",a:["Bekerjasama dan bertanggungjawab","Bermain sahaja","Menyuruh orang lain bekerja"],c:0},
 {q:"Jika berlaku kecemasan di kawasan kejiranan, apakah tindakan wajar?",a:["Memaklumkan orang dewasa atau pihak berkuasa","Menyebarkan khabar angin","Merakam tanpa membantu"],c:0},
 {q:"Apakah cara menggunakan kemudahan awam dengan baik?",a:["Menjaga dan menggunakannya secara berhemah","Merosakkan kemudahan","Mengambil hak orang lain"],c:0},
 {q:"Mengapa kita perlu mematuhi undang-undang?",a:["Untuk menjaga keselamatan dan kesejahteraan bersama","Supaya boleh menyusahkan orang","Kerana takut sahaja"],c:0},
 {q:"Apakah contoh tanggungjawab sebagai anggota masyarakat?",a:["Membantu komuniti dan menjaga keharmonian","Mementingkan diri","Menyebarkan fitnah"],c:0},
 {q:"Apakah tindakan bijak apabila menerima berita yang belum pasti?",a:["Menyemak kesahihannya dahulu","Terus menyebarkannya","Menambah cerita sendiri"],c:0},
 {q:"Bagaimanakah kita boleh menyumbang kepada negara?",a:["Belajar bersungguh-sungguh dan berbakti kepada masyarakat","Merendahkan orang lain","Mengabaikan tanggungjawab"],c:0}
];
let questionOrder=[];
function renderHeroes(){
 $("characters").innerHTML=heroes.map((h,i)=>`
 <div class="char ${i===selected?"selected":""}" onclick="chooseHero(${i})">
  <div class="emoji">${h.emoji}</div><b>${h.name}</b>
  <small>${h.color}</small><small>${h.desc}</small>
 </div>`).join("");
}
function chooseHero(i){selected=i;renderHeroes()}
renderHeroes();
function updateHUD(){
 $("gems").textContent=gems.toLocaleString();
 $("score").textContent=score.toLocaleString();
 $("correct").textContent=correct;
 $("bar").style.width=(correct/10*100)+"%";
}
function startGame(){
 $("overlay").style.display="none";
 $("player").innerHTML=heroes[selected].emoji+
 `<span class="costume">${heroes[selected].name} • pakaian pahlawan Melayu</span>`;
 correct=0;score=0;lane=1;objects=[];questionOrder=[];
 for(let i=0;i<questions.length;i++)questionOrder.push(i);
 questionOrder.sort(()=>Math.random()-.5);
 updateHUD();running=true;questionOpen=false;
 $("toast").textContent="KUTIP PETI HARTA KARUN!";
 lastTime=performance.now();requestAnimationFrame(loop);
}
function move(d){
 if(!running||questionOpen)return;
 lane=Math.max(0,Math.min(2,lane+d));
 $("player").style.left=(lane===0?25:lane===1?50:75)+"%";
}
$("left").onclick=()=>move(-1);
$("right").onclick=()=>move(1);
$("jump").onclick=()=>{if(running){$("player").style.bottom="25%";setTimeout(()=>$("player").style.bottom="14%",350)}};
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
 if(e.key==="ArrowUp"||e.key===" ") $("jump").click();
});
function spawn(){
 // Peti sebenar jarang muncul; selebihnya halangan
 let chest=Math.random()<.28;
 let types=["🔱","🏹","💣","⚔️"];
 let type=chest?"🧰":types[Math.floor(Math.random()*types.length)];
 let l=Math.floor(Math.random()*3);
 let el=document.createElement("div");
 el.className="object";el.textContent=type;
 $("game").appendChild(el);
 objects.push({el,lane:l,y:-8,type,hit:false,speed:chest?0.24:0.31+Math.random()*.12});
}
function loop(t){
 if(!running)return;
 let dt=Math.min(40,t-lastTime);lastTime=t;frame+=dt;
 spawnTimer+=dt;
 if(spawnTimer>850){spawn();spawnTimer=0}
 objects.forEach(o=>{
  o.y+=o.speed*dt;
  o.el.style.top=o.y+"%";
  o.el.style.left=(o.lane===0?25:o.lane===1?50:75)+"%";
  // Perspektif: objek membesar apabila menghampiri pemain
  let scale=.45+o.y/100;
  o.el.style.transform=`translateX(-50%) scale(${scale})`;
  if(!o.hit&&o.y>72&&o.y<88&&o.lane===lane){
   o.hit=true;
   if(o.type==="🧰"){o.el.remove();openQuestion();return}
   else{
    o.el.textContent="💥";$("toast").textContent="AWAS! ELAKKAN HALANGAN!";
    setTimeout(()=>$("toast").textContent="KUTIP PETI HARTA KARUN!",600);
   }
  }
 });
 objects=objects.filter(o=>{
  if(o.y>110){o.el.remove();return false}
  return true
 });
 requestAnimationFrame(loop);
}
function openQuestion(){
 questionOpen=true;running=false;
 let idx=questionOrder[correct%questionOrder.length];
 let q=questions[idx];
 $("overlay").style.display="flex";
 $("overlay").innerHTML=`<div class="panel">
  <div style="font-size:48px">🧰💎</div>
  <h1>PETI HARTA KARUN!</h1>
  <p id="questionText">${q.q}</p>
  ${q.a.map((a,i)=>`<button class="answer" onclick="answer(${i},${q.c})">${String.fromCharCode(65+i)}. ${a}</button>`).join("")}
  <div id="feedback"></div>
 </div>`;
}
function answer(choice,correctAnswer){
 let buttons=document.querySelectorAll(".answer");
 buttons.forEach(b=>b.disabled=true);
 if(choice===correctAnswer){
  correct++;score+=500;gems+=500;
  localStorage.setItem("kp2027Gems",String(gems));
  $("feedback").innerHTML="🎉 TEPAT! +500 GEMS • +500 MARKAH";
  updateHUD();
  setTimeout(()=>{
   if(correct>=10){victory();return}
   closeQuestion();
  },1100);
 }else{
  $("feedback").innerHTML="Belum tepat! Cuba lagi dengan peti seterusnya.";
  setTimeout(closeQuestion,1300);
 }
}
function closeQuestion(){
 $("overlay").style.display="none";
 $("overlay").innerHTML="";
 questionOpen=false;running=true;lastTime=performance.now();
 $("toast").textContent="TERUSKAN CABARAN!";
 requestAnimationFrame(loop);
}
function victory(){
 running=false;questionOpen=false;
 $("overlay").style.display="flex";
 $("overlay").innerHTML=`<div class="panel">
  <div style="font-size:60px">🏆🌈✨</div>
  <h1>GAME OVER!</h1>
  <h2>TAHNIAH, PAHLAWAN KP2027!</h2>
  <h2>EPISOD 1 SELESAI!</h2>
  <p>Anda telah menyelesaikan 10 cabaran Warganegara Aktif.</p>
  <p><b>+${correct*500} markah</b></p>
  <p><b>+${correct*500} Gems</b></p>
  <h1>👏👏👏</h1>
  <h2>BERSAMBUNG KE EPISOD 2...</h2>
  <p>🎉🍬🍭🍫🍬🍭🍫🎉</p>
  <button onclick="location.reload()">MAIN SEMULA</button>
 </div>`;
 for(let i=0;i<100;i++)setTimeout(dropCandy,i*35);
}
function dropCandy(){
 let c=document.createElement("div");c.className="candy";
 c.textContent=["🍬","🍭","🍫","🍡","🌟"][Math.floor(Math.random()*5)];
 c.style.left=Math.random()*100+"%";
 c.style.animationDuration=(2+Math.random()*3)+"s";
 $("game").appendChild(c);setTimeout(()=>c.remove(),5200);
}
updateHUD();
</script>
</body>
</html>
